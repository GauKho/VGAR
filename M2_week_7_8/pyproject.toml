[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vgar-m2-w78"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic==2.13.5", "python-dotenv==1.2.3", "tokenizers==0.22.1", "jinja2==3.1.6"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "mypy==1.20.2", "ruff==0.16.7"]

[project.scripts]
vgar-m2-w78 = "vgar_m2_w78.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
addopts = "--ignore=tests/fixtures -p no:cacheprovider"

