[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]
name = "vgar-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "mcp==2.2.0",
    "pydantic>=2.12,<3",
    "packaging>=24",
    "filelock==4.2.9",
    "python-dotenv>=1",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "PyYAML>=6,<7",
    "tokenizers>=0.22.0,<=0.23.0",
    "Jinja2>=3.1",
    # SWE-bench parquet for the evaluation harness (src/vgar/evaluation)
    "pyarrow==23.0.1",
]

[project.scripts]
vgar = "vgar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy==2.4.0", "ruff==0.17.0"]
history = ["dulwich==1.2.18"]
plot = ["matplotlib>=3.9,<4"]
code-graph = ["networkx>=3.4,<4"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vgar.graph" = ["tsg/*.tsg", "joern/*.sc"]
"vgar.evaluation.repair" = ["prompts/*.txt"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/fixtures", "--strict-markers"]
pythonpath = ["src"]
markers = [
    "hf: needs model weights or a GPU",
    "docker: needs a Docker daemon or SWE-bench images",
]
