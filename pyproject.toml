[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]
name = "vgar-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "torch",
    "accelerate",
    "transformers>=4.51.0",
    "safetensors",

    "langchain>=1.4,<2",
    "langgraph",
    "langchain-huggingface>=1.2,<2",

    "langchain-mcp-adapters==0.3.2",
    "mcp[cli]>=1.24,<2",

    "pydantic>=2",
]


[tool.setuptools.packages.find]
where = ["src"]